# Development stack: hot reload for frontend and backend
# Usage: docker compose up --build

services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (Neon PostgreSQL URL required)}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
