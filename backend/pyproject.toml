[project]
name = "gymflow-backend"
version = "0.1.0"
description = "GymFlow API (FastAPI)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: optional tests requiring a dedicated PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
