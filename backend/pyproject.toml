[project]
name = "gymflow-backend"
version = "0.1.0"
description = "GymFlow API (FastAPI)"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (Vercel installs from this list)
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.20,<2.0",
    "pwdlib[argon2]>=0.2.1",
    "PyJWT>=2.10,<3.0",
    "email-validator>=2.2",
    "phonenumbers>=9.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: optional tests requiring a dedicated PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
